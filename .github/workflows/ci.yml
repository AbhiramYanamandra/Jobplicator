name: Verify source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobplicator_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: jobplicator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobplicator_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python scripts/check_public_repo.py
      - run: python -m pytest -c pytest.ini tests -q
      - run: python -m pytest -c pytest.ini tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://jobplicator_test:test_only@127.0.0.1:5432/jobplicator_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tests/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
        env:
          JOBPLICATOR_TEST_PYTHON: python
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag jobplicator:ci .
